name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build for multiple platforms
        run: |
          # Create build directory
          mkdir -p build
          
          # Build for different platforms
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/transformer-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/transformer-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/transformer-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/transformer-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/transformer-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o build/transformer-windows-arm64.exe .
          
          # Create checksums
          cd build
          sha256sum transformer-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 